services:
  nexus:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # browser เรียก API ผ่าน host VPS — ไม่ใช้ชื่อ service ใน Docker network
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://187.52.125.210:3003/nexus/api/}
    image: nexus-admin:latest
    container_name: nexus-admin
    restart: unless-stopped
    ports:
      - "${NEXUS_PORT:-3002}:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      HOSTNAME: 0.0.0.0
